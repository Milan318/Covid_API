<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COVID-19-APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  
  <body>

    <div class="d-flex justify-content-center align-items-center min-vh-100">
      <div class="container text-center p-5" id="mainContainer">
        <h1 class="mb-4">COVID-19 Report</h1>

        <div class="mb-4">
          <label for="countrySelect" class="form-label">Select Country:</label>
          <select class="form-select w-50 mx-auto" id="countrySelect">
            <option selected disabled>Loading countries...</option>
          </select>
        </div>

        <div id="stats" class="card shadow p-4 mt-4 d-none">
          <h4 id="countryName"></h4>
          <p><strong>Confirmed Cases:</strong> <span id="confirmed"></span></p>
          <p><strong>Deaths:</strong> <span id="deaths"></span></p>
          <p><strong>Recovered:</strong> <span id="recovered"></span></p>
          <p><strong>Last Updated:</strong> <span id="lastUpdated"></span></p>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
