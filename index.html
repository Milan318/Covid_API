<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covid-API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container-fluid d-flex justify-content-center vh-100">
        <div>
            <div class="title">
                <h1 class="text-center mt-5 fw-bold text-white">Covid-19-APP</h1>
            </div>
            <form id="form" class="d-flex gap-2 mt-3" method="post">
                <input id="city" class="form-control" type="text" placeholder="Search City">
                <button class="btn btn-outline-light">GET</button>
            </form>
            <div id="weatherInfo" class="card mt-4 d-flex align-items-center py-5 border-0">
                <div class="information text-center mt-5 text-white"></div>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
